name: release

# Publication is a tag, not a laptop: provenance is an OIDC attestation that only
# a CI provider can issue, so the artefact users install is the one this workflow
# built and verified. No npm token is stored anywhere.
on:
  push:
    tags: ['v*']

# Least privilege: the verify job only reads source, and the publish job
# re-declares the id-token scope it needs for npm OIDC trusted publishing.
permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action reads packageManager from package.json, and pinning a
      # version here as well makes it refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The released artefact is built from this tree, so its registry signatures
      # are checked before the tag can reach the approval gate.
      - name: Dependency signatures
        run: npm audit signatures
      # RELEASE.md requires the tag and package.json version to match; fail the
      # release before a mismatched publish can happen.
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:build
      - run: pnpm test:release
      - run: pnpm run pack-smoke

  publish:
    needs: verify
    # npm requires a package to exist before trusted publishing can be
    # configured, so the first tag is verified here and bootstrapped by hand
    # per RELEASE.md.
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    # Approval gate: this environment requires the release owner's review, so
    # every publish is an explicit human decision.
    environment: npm-release
    timeout-minutes: 15
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action reads packageManager from package.json, and pinning a
      # version here as well makes it refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # devDependencies supply tsc for the prepack build that npm publish runs.
      - run: pnpm install --frozen-lockfile
      # --provenance keeps the attestation explicit and fails loudly if the
      # trusted-publisher match is misconfigured.
      - run: npm publish --provenance --access public
