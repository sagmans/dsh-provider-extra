name: Check

on:
  push:
    branches: [main, init]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.21.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pnpm in runner-local directory
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpm" --ignore-scripts --no-audit "pnpm@$PNPM_VERSION"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      # Harness packages arrive from the registry at the version this plugin
      # declares, so the checks exercise what an installed profile resolves.
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      # Registry signatures and publish attestations for the whole tree: an
      # unsigned or tampered dependency fails here, before anything ships.
      - name: Dependency signatures
        run: npm audit signatures
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      # The declared range, the verified releases, and what every harness
      # package declares must agree before anything is installed from them.
      - name: Harness matrix
        run: node tools/harness-matrix.mjs
      - name: Build
        run: pnpm run build
      # The CLI and mount tests run the build output, not the sources.
      - name: Integration tests
        run: pnpm run test:build
      # A regression in the release guards would first surface as an
      # unrecoverable registry write, so they run on every change.
      - name: Release helper tests
        run: pnpm test:release
      - name: Package smoke
        run: pnpm run pack-smoke
      - name: Audit plugin dependencies
        run: pnpm audit --audit-level high
