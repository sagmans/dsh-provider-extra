packages: []
# The harness packages this plugin consumes are registry peers, so they and the
# peers of those peers must resolve here; without this every harness import in
# the tests would resolve to nothing.
autoInstallPeers: true
# Quarantine window for registry packages (minutes): a new release stays out
# for its first week.
minimumReleaseAge: 10080
allowBuilds:
  # Build steps the pinned toolchain needs: esbuild's binary is required by tsx,
  # and the profile tests drive @deepseek-ai/dsh, which loads a subprocess
  # backend, a native pty, and FFI.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
# Security floors for transitive dependencies the harness pulls in. Each entry
# only matches the vulnerable range, so a harness release that already ships the
# fix resolves untouched and the entry can be dropped then.
#   GHSA-6qxp-vccf-f47h  @modelcontextprotocol/sdk, @modelcontextprotocol/client
#   GHSA-6prh-2h8m-c8cw  @modelcontextprotocol/sdk, @modelcontextprotocol/client
#   GHSA-jqcg-44mw-7w3h  proxy-addr
#   GHSA-ch52-4w7c-c8xp  http-cache-semantics
#   GHSA-wq5f-xc86-pv6w  sharp
#   GHSA-px8p-9vwx-vf98  fflate
#   GHSA-hrr3-gc8f-f4qj  fast-uri
#   GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr,
#   GHSA-xhq7-xmqj-769h  fast-uri
#   GHSA-mrhx-c7xc-m3w5  zod (the harness pins 4.4.3 exactly)
#   GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472  undici
#                        (the harness pins 8.11.2 exactly)
overrides:
  '@modelcontextprotocol/client@<2.3.0': ^2.3.1
  '@modelcontextprotocol/sdk@<1.32.0': ^1.32.1
  'proxy-addr@<2.0.8': ^2.0.8
  'http-cache-semantics@<4.2.1': ^4.2.1
  'sharp@<0.35.5': ^0.35.5
  'fflate@>=0.8.0 <0.8.3': ^0.8.3
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'zod@>=4.0.0 <4.6.6': ^4.6.7
  'undici@>=8.0.0 <8.12.2': ^8.12.2
