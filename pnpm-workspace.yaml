packages: []
# The harness packages this plugin consumes are registry peers, so they and the
# peers of those peers must resolve here; without this every harness import in
# the tests would resolve to nothing.
autoInstallPeers: true
# Quarantine window for registry packages (minutes): a new release stays out
# for its first week.
minimumReleaseAge: 10080
# Temporary exemption for the matrix bump, which has to test the harness release
# the registry serves as latest (RELEASE.md). Harness 0.2.1-rc.2, the framework
# releases it pins, and the pi-ai release its model adapter resolves were all
# published inside the window, and pnpm verifies each lockfile entry against it
# even on a frozen install. Each entry names one exact version, never a name
# pattern or a scope, so no later release inherits the exemption. Remove the
# whole list after 2026-10-24 08:52 UTC, when the youngest entry (published
# 2026-10-17 08:51 UTC) leaves the window.
minimumReleaseAgeExclude:
  # The harness release itself, one entry per package it publishes.
