packages: []
# The harness packages this plugin consumes are registry peers, so they and the
# peers of those peers must resolve here; without this every harness import in
# the tests would resolve to nothing.
autoInstallPeers: true
minimumReleaseAge: 10080
# A verified harness release is published inside the release-age window, and
# this project tracks that exact release rather than waiting the window out. The
# window cannot be waited out for the mount either: a harness release resolves
# its own vendor's packages, so the exclusion is that publisher's scope and not
# the plugin's own dependency set.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  # The harness mount resolves its own model adapter's vendor, so a verified
  # harness release pins a pi-ai published inside the same window.
  - '@earendil-works/*'
allowBuilds:
  # Build steps the pinned toolchain needs: esbuild's binary is required by tsx,
  # and the profile tests drive @deepseek-ai/dsh, which loads a subprocess
  # backend, a native pty, and FFI.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
